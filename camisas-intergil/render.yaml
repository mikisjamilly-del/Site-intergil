# Receita de publicação para o Render (render.com): cria o site + o banco PostgreSQL de uma vez.
databases:
  - name: intergil-db
    databaseName: intergil
    plan: free

services:
  - type: web
    name: camisas-intergil
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: intergil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENHA_REPRESENTANTE
        sync: false        # o Render vai pedir para você digitar
      - key: SENHA_ADM
        sync: false        # o Render vai pedir para você digitar
