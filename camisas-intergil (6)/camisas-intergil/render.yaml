databases:
  - name: intergil-db
    databaseName: intergil
    plan: free

services:
  - type: web
    name: camisas-intergil
    runtime: node
    plan: free
    buildCommand: |
      cd "$(dirname "$(find . -path '*/backend/server.js' | head -n 1)")" && npm install
    startCommand: |
      cd "$(dirname "$(find . -path '*/backend/server.js' | head -n 1)")" && npm start
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: intergil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENHA_REPRESENTANTE
        sync: false
      - key: SENHA_ADM
        sync: false
